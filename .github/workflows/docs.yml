# Builds the documentation with MkDocs Material and publishes it to GitHub Pages.
# Python is used here only to build the site; the library and its tests do not need it.
name: Docs
on:
  push:
    branches: [master]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
