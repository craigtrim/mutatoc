# Native build and full test suite; nothing but CMake and a C compiler (craigtrim/mutatoc#1).
name: C port compatibility
on: [push, pull_request]
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build with address and undefined-behavior sanitizers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMUTATOC_SANITIZE=ON
          cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --timeout 3600
