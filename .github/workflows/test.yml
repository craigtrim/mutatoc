name: C port compatibility
on: [push, pull_request]
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: craigtrim/mutato
          ref: da6bfa5df80b208a3271e111f2921ad281d0da98
          path: .reference/upstream
          sparse-checkout: resources/lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned preprocessing
        run: python scripts/setup_spacy.py --with-sparql --model-archive .reference/upstream/resources/lib/en_core_web_sm-3.8.0.tar.gz
      - name: Configure and build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            py="$PWD/.runtime/Scripts/python.exe"
          else
            py="$PWD/.runtime/bin/python"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMUTATOC_TEST_PYTHON="$py"
          cmake --build build --config Release
      - name: Test native engine and full spaCy bridge
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run all upstream assertions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            py="$PWD/.runtime/Scripts/python.exe"
            export MUTATOC_EXE="$PWD/build/Release/mutatoc.exe"
          else
            py="$PWD/.runtime/bin/python"
            export MUTATOC_EXE="$PWD/build/mutatoc"
          fi
          "$py" -m pip install -r tests/upstream/requirements.txt
          "$py" scripts/run_upstream.py
          "$py" scripts/run_lingpatlab_upstream.py --exe "$MUTATOC_EXE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
